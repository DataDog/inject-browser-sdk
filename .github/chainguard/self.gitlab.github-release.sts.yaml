# Check and publish IIS releases from mirrored iis-X.Y.Z tag pipelines only, using
# the tagged CI config. Kept separate from release-please, which never needs
# tag-scoped credentials.
issuer: https://gitlab.ddbuild.io

subject_pattern: 'project_path:DataDog/inject-browser-sdk:ref_type:tag:ref:iis-[0-9]+\.[0-9]+\.[0-9]+'

claim_pattern:
  project_path: "DataDog/inject-browser-sdk"
  ref_type: "tag"
  ref: 'iis-[0-9]+\.[0-9]+\.[0-9]+'
  pipeline_source: "push"
  ci_config_ref_uri: 'gitlab\.ddbuild\.io/DataDog/inject-browser-sdk//\.gitlab-ci\.yml@refs/tags/iis-[0-9]+\.[0-9]+\.[0-9]+'

permissions:
  contents: write
  # check-release-tree.sh finds the release PR behind the tag commit.
  pull_requests: read
