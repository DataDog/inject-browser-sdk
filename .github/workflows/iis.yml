name: iis

on:
  push:
    branches: [main]
    paths:
      - 'injector_IIS/**'
      - '.github/workflows/iis.yml'
  pull_request:
    paths:
      - 'injector_IIS/**'
      - '.github/workflows/iis.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-iis:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/datadog/inject-browser-sdk:builder-a502380
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
      RUSTFLAGS: "-Lnative=/xwin/crt/lib/x86_64 -Lnative=/xwin/sdk/lib/ucrt/x86_64 -Lnative=/xwin/sdk/lib/um/x86_64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check version contract
        run: python3 -m unittest discover -s injector_IIS/test/version_tests
      - name: Build
        working-directory: injector_IIS
        run: |
          cmake --preset=ci-xcomp -B build -DCMAKE_BUILD_TYPE=Debug .
          cmake --build build -j
      - name: Upload IIS build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iis-build
          path: injector_IIS/build
          include-hidden-files: true

  test-iis:
    needs: build-iis
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download IIS build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iis-build
          path: injector_IIS/build
      - name: Run Unit Tests
        run: .\injector_IIS\build\test\unittests\iis_injector_tests.exe
      - name: Install Dependencies
        run: |
          choco install -y wixtoolset
          irm https://astral.sh/uv/install.ps1 | iex
      - name: Build .msi package
        working-directory: injector_IIS
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          $env:VSTUDIO_ROOT = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $env:OutDir = (Join-Path (Split-Path ${pwd}) "build_out") + "\"
          uv run --with invoke invoke iis.package --iis-dll ${pwd}\build\iis_injector.dll --out-dir $env:OutDir --debug
      - name: Upload MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: injector_IIS_installer.msi
          path: build_out\injector_IIS_installer.msi
      - name: Copy MSI to path expected by setup script
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path injector_IIS\injector_IIS_installer\bin\x64\Debug\en-us
          Copy-Item build_out\injector_IIS_installer.msi injector_IIS\injector_IIS_installer\bin\x64\Debug\en-us\
      - name: Run End-to-End Tests
        # --isolation=hyperv allows running Windows images built on a different Windows Server
        # version than the runner (e.g. ltsc2019 image on windows-2022 host).
        run: |
          docker run --isolation=hyperv --entrypoint powershell `
          -e WEBSERVER-FLAVOR=iis -v ${pwd}:C:\inject-browser-sdk `
          datadog/docker-library:rum-auto-instrumentation-windows-iis-latest `
          -NoProfile -ExecutionPolicy Bypass -File `
          C:\inject-browser-sdk\injector_IIS\scripts\ci\run-container-integration-tests.ps1
          $containerExitCode = $LASTEXITCODE
          Write-Host "IIS integration-test container exited with code $containerExitCode"
          exit $containerExitCode
