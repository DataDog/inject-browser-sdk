name: installer

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'installer/**'
      - '.github/workflows/installer.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: find installer/ -type f -executable | xargs shellcheck

  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: installer/configurator/go.mod
      - name: Build configurator (amd64)
        run: CGO_ENABLED=0 go -C ./installer/configurator build -o proxy-configurator
      - name: Upload proxy-configurator (amd64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxy-configurator-amd64
          path: installer/configurator/proxy-configurator
      - name: Upload install-proxy-datadog.sh (amd64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-proxy-datadog-amd64
          path: installer/install-proxy-datadog.sh

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: installer/configurator/go.mod
      - name: Test configurator
        run: go test -C ./installer/configurator -v
      - name: Build configurator (arm64)
        run: CGO_ENABLED=0 go -C ./installer/configurator build -o proxy-configurator
      - name: Upload proxy-configurator (arm64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxy-configurator-arm64
          path: installer/configurator/proxy-configurator
      - name: Upload install-proxy-datadog.sh (arm64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-proxy-datadog-arm64
          path: installer/install-proxy-datadog.sh

  installer-test:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { proxy-kind: nginx, base-dockerfile: nginx.bookworm.Dockerfile }
          - { proxy-kind: nginx, base-dockerfile: nginx.alpine.Dockerfile }
          - { proxy-kind: nginx, base-dockerfile: nginx.al2023.Dockerfile }
          - { proxy-kind: httpd, base-dockerfile: httpd.bookworm.Dockerfile }
          - { proxy-kind: httpd, base-dockerfile: httpd.alpine.Dockerfile }
          - { proxy-kind: httpd, base-dockerfile: httpd.al2023.Dockerfile }
          # Distro-managed configs are frequently symlinks, which the installer has
          # to write through rather than replace.
          - { proxy-kind: nginx, base-dockerfile: nginx.bookworm.Dockerfile, config-symlink: 1 }
          - { proxy-kind: httpd, base-dockerfile: httpd.bookworm.Dockerfile, config-symlink: 1 }
    env:
      DD_API_KEY: fakekey
      PROXY_KIND: ${{ matrix.proxy-kind }}
      PROXY_DOCKERFILE: ${{ matrix.base-dockerfile }}
      CONFIG_SYMLINK: ${{ matrix.config-symlink }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download proxy-configurator (amd64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proxy-configurator-amd64
          path: installer
      - name: Make proxy-configurator executable
        run: chmod +x installer/proxy-configurator
      - name: Run installer tests
        run: docker compose -f installer/test/docker-compose.yml up --build --exit-code-from proxy

  installer-download-test:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: fakekey
      NGINX_DOCKERFILE: nginx.bookworm.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run installer download tests
        run: docker compose -f installer/test/docker-compose-download.yml up --build --exit-code-from nginx
