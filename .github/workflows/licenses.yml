name: License attribution

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    container: rust:1.94.0-bookworm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ScanCode
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv libmagic1 libarchive13
          python3 -m venv /tmp/license-venv
          /tmp/license-venv/bin/pip install -r licenses/requirements.txt
          echo /tmp/license-venv/bin >> "$GITHUB_PATH"
      - name: Test attribution checks
        run: python -m unittest discover -s scripts/tests
      - name: Check source and Rust attributions
        run: python scripts/license.py
