---
variables:
  DEVCONTAINER_IMAGE_NAME: registry.ddbuild.io/ci/inject-browser-sdk/devcontainer
  NYDUS_DD_IMAGE: registry.ddbuild.io/images/nydus:v152562634-de9f215-v2.4.0-dd.3@sha256:ce137717776daf7d2e1edc0c7a62179acadb4135adfc57e242ef587b9f2023b8

.not_scheduled:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always

# Single job: check registry, build if missing, nydusify if needed, export DEVCONTAINER_IMAGE.
devcontainer_image:
  stage: build
  extends: .not_scheduled
  image: $NYDUS_DD_IMAGE
  tags: ["arch:amd64"]
  needs: []
  script:
    # Stage and hash the devcontainer build context the same way
    # .devcontainer/devcontainer.mk does (rsync the files listed in
    # .devcontainer/context.files into a temp dir, optionally applying
    # context.filter, then hash the staged tree with `--- <path> ---`
    # markers). Local `make dev-image` and this CI job must produce the
    # same tag — otherwise the cache-hit check below misses every time.
    # The nydus image doesn't ship rsync, so install it first.
    - |
      set -euo pipefail
      if ! command -v rsync >/dev/null 2>&1; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -qq -y --no-install-recommends rsync
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache rsync
        else
          echo "ERROR: rsync missing and no known package manager (apt-get/apk) available" >&2
          exit 1
        fi
      fi
      if [ ! -f .devcontainer/context.files ]; then
        echo "ERROR: .devcontainer/context.files not found" >&2
        exit 1
      fi
      ctx=$(mktemp -d)
      trap 'rm -rf "$ctx"' EXIT
      if [ -f .devcontainer/context.filter ]; then
        grep -Ev '^[[:space:]]*(#|$)' .devcontainer/context.files \
          | rsync -aR --files-from=- --filter="merge .devcontainer/context.filter" ./ "$ctx/"
      else
        grep -Ev '^[[:space:]]*(#|$)' .devcontainer/context.files \
          | rsync -aR --files-from=- ./ "$ctx/"
      fi
      if [ ! -f "$ctx/.devcontainer/Dockerfile" ]; then
        echo "ERROR: .devcontainer/Dockerfile not staged; check .devcontainer/context.files" >&2
        exit 1
      fi
      TAG=$(cd "$ctx" && find . -type f | LC_ALL=C sort \
        | while IFS= read -r f; do printf -- '--- %s ---\n' "$f"; cat "$f"; done \
        | sha256sum | cut -c1-12)
      IMAGE="${DEVCONTAINER_IMAGE_NAME}:${TAG}"
      echo "DEVCONTAINER_IMAGE=${IMAGE}" > build.env
    - |
      if crane manifest "${IMAGE}" >/dev/null 2>&1; then
        echo "Image ${IMAGE} already exists in registry"
      else
        echo "Image ${IMAGE} not found — building"
        docker buildx build \
          --build-context "repo=$(pwd)" \
          --platform linux/amd64,linux/arm64 \
          --push \
          -t "${IMAGE}" \
          .devcontainer/
      fi
    - |
      MANIFEST=$(crane manifest --platform linux/amd64 "${IMAGE}") || {
        echo "WARNING: Failed to fetch manifest for ${IMAGE} — skipping nydus check"
        exit 0
      }
      if echo "${MANIFEST}" | grep -qF "nydus.blob"; then
        echo "Image ${IMAGE} already has nydus layers"
      else
        echo "Converting ${IMAGE} to nydus"
        nydus-convert "${IMAGE}" && \
          crane copy "${IMAGE}-nydus" "${IMAGE}" && \
          echo "Image ${IMAGE} replaced with nydus-optimized version" || \
          echo "WARNING: nydus conversion/replacement failed — continuing without nydus layers"
      fi
  artifacts:
    reports:
      dotenv: build.env
