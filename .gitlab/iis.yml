---
variables:
  WINDOWS_BUILD_IMAGE: registry.ddbuild.io/ci/datadog-agent-buildimages/windows_ltsc2022_x64:v105206457-cb3f8790
  # Generic Linux build image; the e2e job installs Pulumi + plugins itself
  # rather than relying on a bespoke test-infra-definitions runner image
  # (mirrors DataDog/datadog-agent#42832).
  E2E_LINUX_IMAGE: registry.ddbuild.io/ci/datadog-agent-buildimages/linux:v105206457-cb3f8790
  IIS_AGENT_DEPLOY_IMAGE: registry.ddbuild.io/ci/datadog-agent-buildimages/gitlab_agent_deploy:v105206457-cb3f8790
  ARTIFACTS_DIR: artifacts

########################################
# IIS build and test jobs
########################################

.IIS_build:
  stage: build
  tags: ["windows-v2:2022"]
  needs: []
  variables:
    BUILD_CONFIGURATION: Release
    ARCH: x64
    GIT_DEPTH: 500 #Default is 20
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - |
      $image = "${WINDOWS_BUILD_IMAGE}"
      $cached = docker images -q $image
      if ($cached) {
        Write-Host "Image $image is already cached on this runner."
      } else {
        Write-Host "Image $image is not cached — pulling. This can take ~12 minutes."
        Write-Host "The runner AMI pre-pulls the latest tag. After a tag bump, new AMIs"
        Write-Host "need to be built and runners recycled before the cache is warm again."
      }
      docker pull $image
    - if (Test-Path build-out) { remove-item -recurse -force build-out }
    - >
      docker run --rm
      -m 4096M
      -v "$(Get-Location):c:\mnt"
      -e BUILD_OUTDIR="c:\mnt\build-out\${CI_JOB_ID}"
      -e BUILD_CONFIGURATION=$BUILD_CONFIGURATION
      -e ARCH=$ARCH
      -e TEST_DIR="c:\mnt\injector_IIS\test\"
      -e WINDOWS_BUILDER=true
      -e SIGN_WINDOWS_DD_WCS=true
      -e AWS_NETWORKING=true
      -e CI=true
      -e CI_JOB_ID=${CI_JOB_ID}
      -e CI_PROJECT_NAME=${CI_PROJECT_NAME}
      ${WINDOWS_BUILD_IMAGE}
      c:\mnt\injector_IIS\scripts\build_injector_IIS.bat
    # Copy output files to artifacts dir for use in later jobs
    - if (Test-Path $ARTIFACTS_DIR) { remove-item -recurse -force $ARTIFACTS_DIR }
    - mkdir $ARTIFACTS_DIR
    - xcopy /e/s build-out\${CI_JOB_ID}\*.* $ARTIFACTS_DIR
  artifacts:
    expire_in: 2 weeks
    paths:
      - $ARTIFACTS_DIR

.IIS_build_when:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        compare_to: refs/heads/main
        paths:
          - injector_IIS/**/*
          - lib/**/*
          - Cargo.toml
          - Cargo.lock
          - .gitlab-ci.yml
          - .gitlab/iis.yml
    - changes:
        - injector_IIS/**/*
        - lib/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
        - .gitlab/iis.yml



injector_IIS_build:
  extends:
    - .IIS_build
    - .IIS_build_when

manual_injector_IIS_build:
  extends: .IIS_build
  when: manual

injector_IIS_unit_test:
  stage: test
  extends: .IIS_build_when
  tags: ["windows-v2:2022"]
  needs: []
  script:
    - >
      docker run --rm
      -m 4096M
      -v "$(Get-Location):c:\mnt"
      ${WINDOWS_BUILD_IMAGE}
      powershell -ExecutionPolicy Bypass -File c:\mnt\injector_IIS\scripts\ci\injector_IIS_unit_test.ps1
    - If ($lastExitCode -ne 0) { exit $lastExitCode }

injector_IIS_unit_test_asan:
  stage: test
  extends: .IIS_build_when
  tags: ["windows-v2:2022"]
  needs: []
  allow_failure: true
  script:
    - >
      docker run --rm
      -m 4096M
      -v "$(Get-Location):c:\mnt"
      ${WINDOWS_BUILD_IMAGE}
      powershell -ExecutionPolicy Bypass -File c:\mnt\injector_IIS\scripts\ci\injector_IIS_unit_test.ps1
      -Preset ci-native-asan -BuildDir build-asan -BuildType Debug
    - If ($lastExitCode -ne 0) { exit $lastExitCode }

# Cross-compile + wine64 mirror of injector_IIS_unit_test, run on a Linux
# runner inside the devcontainer image. Same gtest binary the local
# `make test-iis` produces. Faster feedback than the Windows-container path.
injector_IIS_unit_test_linux_wine:
  stage: test
  extends: .IIS_build_when
  tags: ["arch:amd64"]
  image: $DEVCONTAINER_IMAGE
  needs:
    - devcontainer_image
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - make test-iis

# Shared script that extracts the pulumi plugin tarball produced by
# go_e2e_deps into ~/.pulumi so e2e jobs can run `pulumi up` without
# re-downloading providers (mirrors DataDog/datadog-operator's
# `.retrieve_linux_pulumi_plugins`).
.retrieve_linux_pulumi_plugins:
  - mkdir -p ~/.pulumi && tar xJf pulumi_plugins.tar.xz -C ~/.pulumi
  - rm -f pulumi_plugins.tar.xz

# Pre-fetch the Pulumi providers used by the e2e scenarios once per pipeline.
# The plugins are cached on go.mod and shared with downstream e2e jobs as an
# artifact, so the generic datadog-agent-buildimages/linux image only pays the
# download cost on a cache miss (mirrors DataDog/datadog-operator's
# `go_e2e_deps`).
.go_e2e_deps_template:
  stage: deps_fetch
  image: $E2E_LINUX_IMAGE
  tags: ["arch:amd64"]
  needs: []
  variables:
    KUBERNETES_CPU_REQUEST: 4
  script:
    - |
      if [ ! -f pulumi_plugins.tar.xz ]; then
        pushd injector_IIS/test/e2e_tests
        GOWORK=off PULUMI_CONFIG_PASSPHRASE=dummy pulumi --non-interactive plugin install
        popd
        tar c -I "xz -T${KUBERNETES_CPU_REQUEST}" -f $CI_PROJECT_DIR/pulumi_plugins.tar.xz -C ~/.pulumi plugins
      fi
  artifacts:
    expire_in: 1 day
    paths:
      - $CI_PROJECT_DIR/pulumi_plugins.tar.xz
  cache:
    - key:
        files:
          - injector_IIS/test/e2e_tests/go.mod
          - .gitlab/iis.yml
        prefix: "pulumi_plugins"
      paths:
        - pulumi_plugins.tar.xz

go_e2e_deps:
  extends:
    - .go_e2e_deps_template
    - .IIS_build_when

manual_go_e2e_deps:
  extends: .go_e2e_deps_template
  when: manual

.injector_IIS_e2e_test_template:
  stage: test
  tags: ["arch:amd64"]
  retry:
    max: 2
    when:
      - script_failure
  image: $E2E_LINUX_IMAGE
  variables:
    AWS_SSM_PREFIX: "ci.inject-browser-sdk."
    KEY_PAIR_NAME: "ci.inject-browser-sdk"
    KUBERNETES_MEMORY_REQUEST: 12Gi
    KUBERNETES_MEMORY_LIMIT: 16Gi
    E2E_OUTPUT_DIR: $CI_PROJECT_DIR/e2e-output
    PULUMI_CONFIG_PASSPHRASE: dummy
  before_script:
    # Extract the pulumi plugins produced by go_e2e_deps into ~/.pulumi
    - !reference [.retrieve_linux_pulumi_plugins]
    # Read AWS config for agent-qa role from ddbuild's SSM, and then assume agent-qa role
    - mkdir -p ~/.aws
    - aws ssm get-parameter --region us-east-1 --name "${AWS_SSM_PREFIX}agent-qa-profile" --with-decryption --query "Parameter.Value" --out text >> ~/.aws/config
    - export AWS_PROFILE="agent-qa-ci"
    # Fetch SSH private and public keys from agent-qa's SSM
    - mkdir -p ~/.ssh
    - aws ssm get-parameter --region us-east-1 --name "${AWS_SSM_PREFIX}ssh_private_key_rsa" --with-decryption --query "Parameter.Value" --out text >> ~/.ssh/$KEY_PAIR_NAME
    - aws ssm get-parameter --region us-east-1 --name "${AWS_SSM_PREFIX}ssh_public_key_rsa" --with-decryption --query "Parameter.Value" --out text >> ~/.ssh/${KEY_PAIR_NAME}.pub
    - chmod 0400 ~/.ssh/$KEY_PAIR_NAME
    - eval `ssh-agent -s`
    - ssh-add ~/.ssh/$KEY_PAIR_NAME
    # Use S3 backend to store stack status
    - pulumi login "s3://dd-pulumi-state?region=us-east-1&awssdk=v2&profile=$AWS_PROFILE"
    # Define the environment variables which the E2E framework will use to build a testing profile
    - export E2E_PROFILE="ci"
    - export CI_SECRET_PREFIX=$AWS_SSM_PREFIX
    - export E2E_KEY_PAIR_NAME=$KEY_PAIR_NAME
    - export E2E_PUBLIC_KEY_PATH="/root/.ssh/${KEY_PAIR_NAME}.pub"
  script:
    - mkdir -p injector_IIS/test/e2e_tests/test_assets
    ## the msi will have a version-specific name, but there should be only one.
    ## copy that to the filename expected by the test.
    - cp ${ARTIFACTS_DIR}/*.msi injector_IIS/test/e2e_tests/test_assets/injector_IIS.msi
    - cd injector_IIS/test/e2e_tests && go test -v -timeout 30m
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - $E2E_OUTPUT_DIR

injector_IIS_e2e_test:
  extends:
    - .injector_IIS_e2e_test_template
    - .IIS_build_when
  needs: ["injector_IIS_build", "go_e2e_deps"]

manual_injector_IIS_e2e_test:
  extends: .injector_IIS_e2e_test_template
  when: manual
  needs: ["manual_injector_IIS_build", "manual_go_e2e_deps"]

.injector_IIS_release:
  stage: release
  tags: ["arch:amd64"]
  needs: []
  image: $IIS_AGENT_DEPLOY_IMAGE
  when: manual
  allow_failure: false
  script:
    ## the msi will have a version-specific name, but there should be only one.
    ## copy that to the expected filename.
    - cp ${ARTIFACTS_DIR}/*.msi ${ARTIFACTS_DIR}/injector_IIS.msi
    - aws s3 cp
      --region us-east-1
      --sse AES256
      --acl public-read
      --recursive
      --exclude "*"
      --include "injector_IIS.msi"
      $ARTIFACTS_DIR
      s3://$S3_BUCKET/iis/$CI_COMMIT_SHORT_SHA/$ARCH/
    - echo https://$S3_BUCKET.s3.amazonaws.com/iis/$CI_COMMIT_SHORT_SHA/$ARCH/injector_IIS.msi
  artifacts:
    expire_in: 2 weeks
    paths:
      - $ARTIFACTS_DIR

manual_injector_IIS_release:
  extends: .injector_IIS_release
  when: manual
  needs: ["manual_injector_IIS_build"]
  variables:
    S3_BUCKET: rum-auto-instrumentation
    BUILD_CONFIGURATION: Release
    ARCH: x64


promote_injector_IIS_release_candidate:
  stage: release
  tags: ["arch:amd64"]
  image: $IIS_AGENT_DEPLOY_IMAGE
  when: manual
  variables:
    RC_COMMIT: ""
    ARCH: x64
    S3_BUCKET: rum-auto-instrumentation
  script:
    - aws s3 cp --region us-east-1 --sse AES256 --acl public-read s3://$S3_BUCKET/iis/$RC_COMMIT/$ARCH/injector_IIS.msi injector_IIS.msi
    - aws s3 cp --region us-east-1 --sse AES256 --acl public-read injector_IIS.msi s3://$S3_BUCKET/iis/latest/$ARCH/
