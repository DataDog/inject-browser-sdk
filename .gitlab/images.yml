variables:
  WINDOWS_BUILD_IMAGE_REPO: registry.ddbuild.io/ci/datadog-agent-buildimages/windows_ltsc2022_x64

# Keep WINDOWS_DEFAULT_IMAGE on the build image the Windows runner AMI
# pre-pulls, so IIS jobs skip a ~12 minute pull. Runs from the pipeline
# schedule that sets WINDOWS_BUILD_IMAGE_BUMP=1 on main, managed in Terraform:
# ddoghq/gitlab-config gitlab/projects/inject-browser-sdk/schedule_pipelines.tf.
.windows_build_image_schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $WINDOWS_BUILD_IMAGE_BUMP == "1"

windows_build_image_survey:
  stage: build
  tags: ["windows-v2:2022"]
  needs: []
  rules:
    - !reference [.windows_build_image_schedule, rules]
    # Read-only, so branches that change it can try it out.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        compare_to: refs/heads/main
        paths:
          - .gitlab/images.yml
          - scripts/survey-windows-build-image.ps1
      when: manual
      allow_failure: true
  script:
    - .\scripts\survey-windows-build-image.ps1
  artifacts:
    reports:
      dotenv: windows-build-image.env

windows_build_image_bump:
  stage: deps_fetch
  extends: .windows_build_image_schedule
  image: registry.ddbuild.io/images/dd-octo-sts-ci-base:2026.08-2
  tags: ["arch:amd64"]
  needs: ["windows_build_image_survey"]
  resource_group: windows-build-image-bump
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  script:
    # Only scheduled main pipelines can mint this write token; see
    # .github/chainguard/self.gitlab.windows-image-bump.sts.yaml.
    - dd-octo-sts token --scope DataDog/inject-browser-sdk --policy self.gitlab.windows-image-bump > "$HOME/token.txt"
    - export GH_TOKEN="$(cat "$HOME/token.txt")"
    - ': "${GH_TOKEN:?dd-octo-sts produced an empty token}"'
    # The image runs as a non-root user that does not own the checkout.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - scripts/bump-windows-build-image.sh
  after_script:
    - if [ -f "$HOME/token.txt" ]; then dd-octo-sts revoke -t "$(cat "$HOME/token.txt")" || true; fi
