variables:
  RELEASE_TAG:
    value: null
    description: 'The release tag to use for the installer release'

# Writes go through the trusted-jobs CI Identity (main is trusted): the runner
# role cannot write to the bucket. The release tools image has the AWS CLI and
# the CI Identities client; release_tools_image builds it for this pipeline.
.installer_release:
  stage: release
  tags: ["arch:amd64"]
  extends: [.release_tools, .ci_identity]
  needs: ["release_tools_image"]
  when: manual
  allow_failure: false
  script:
    - mkdir downloads
    - ./scripts/download-release-artifacts.sh $RELEASE_TAG ./downloads
    - ci-identities-ci-job-client assume-role -- aws s3 cp
      --region us-east-1
      --sse AES256
      --acl public-read
      --recursive
      "downloads"
      s3://$S3_BUCKET/installer/$RELEASE_TAG/
    - ci-identities-ci-job-client assume-role -- aws s3 cp
      --region us-east-1
      --sse AES256
      --acl public-read
      --recursive
      "downloads"
      s3://$S3_BUCKET/installer/latest/

manual_installer_release:
  extends: .installer_release
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_TAG != null && $RELEASE_TAG != ""
  variables:
    S3_BUCKET: rum-auto-instrumentation
