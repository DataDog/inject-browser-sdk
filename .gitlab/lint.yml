---
.lint_base:
  stage: test
  extends: .not_scheduled
  image: $DEVCONTAINER_IMAGE
  tags: ["arch:amd64"]
  needs:
    - job: devcontainer_image
      artifacts: true

format:
  extends: .lint_base
  script:
    - make format-cpp-check
    - cargo fmt --all -- --check

tidy:
  extends: .lint_base
  # TODO: clippy 1.94.0 flags pre-existing doc_lazy_continuation /
  # needless_return in lib/inject-browser-sdk/src/injector.rs. Drop
  # allow_failure once those are fixed in their own PR.
  allow_failure: true
  script:
    - make tidy-cpp
    - cargo clippy --all-targets --all-features -- -D warnings
