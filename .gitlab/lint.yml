---
.lint_base:
  stage: test
  extends: .not_scheduled
  image: $DEVCONTAINER_IMAGE
  tags: ["arch:amd64"]
  needs:
    - job: devcontainer_image
      artifacts: true

format:
  extends: .lint_base
  script:
    - make format-cpp-check
    - cargo fmt --all -- --check

tidy:
  extends: .lint_base
  script:
    - make tidy-cpp
    - cargo clippy --all-targets --all-features -- -D warnings
