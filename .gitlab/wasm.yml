---
.wasm_base:
  tags: ["arch:amd64"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - lib/**/*
        - wasm/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab/wasm.yml

wasm_build:
  stage: build
  extends: .wasm_base
  image: registry.ddbuild.io/images/mirror/ubuntu:22.04
  needs: []
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.73.0
    - . "$HOME/.cargo/env"
    - rustup target add wasm32-unknown-unknown
  script:
    - cargo build --release --target wasm32-unknown-unknown -p inject-browser-sdk-ffi --no-default-features --features alloc
    - test -f target/wasm32-unknown-unknown/release/inject_browser_sdk_ffi.wasm
  artifacts:
    expire_in: 2 weeks
    paths:
      - target/wasm32-unknown-unknown/release/inject_browser_sdk_ffi.wasm

wasm_node_integration_test:
  stage: test
  extends: .wasm_base
  image: registry.ddbuild.io/images/mirror/node:20
  needs: ["wasm_build"]
  script:
    - node --test wasm/node/test_integration.js
