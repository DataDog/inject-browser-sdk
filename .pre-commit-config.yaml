repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: make format
        language: system
        pass_filenames: false
        files: '\.(cpp|h|c)$'

      - id: clang-tidy
        name: clang-tidy
        entry: make lint
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: '\.(cpp|h|c)$'

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        files: '(\.rs|Cargo\.toml)$'

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy
        language: system
        pass_filenames: false
        files: '(\.rs|Cargo\.toml)$'

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        pass_filenames: false
        files: '(\.rs|Cargo\.toml)$'
