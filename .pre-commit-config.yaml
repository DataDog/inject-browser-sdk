repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: make format
        language: system
        pass_filenames: false
        files: '\.(cpp|h|c)$'

      - id: clang-tidy
        name: clang-tidy
        entry: make lint
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: '\.(cpp|h|c)$'
