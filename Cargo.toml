[workspace]
resolver = "2"
members = [
  "lib/inject-browser-sdk",
  "lib/inject-browser-sdk-ffi",
  "fuzz",
  "cmd/check_conf", "cmd/test_inject",
]

[workspace.package]
edition = "2021"
version = "1.2.1-dev"
rust-version = "1.91.0"

[workspace.dependencies]
# Stopgap: pins `pawel/no-std-library-config` on DataDog/libdatadog which
# transitively pulls a personal `yaml_serde` fork (see Cargo.lock).
#
# KNOWN RISK: this points at a personal feature branch. Although the rev is
# pinned, a force-push on that branch would make the commit unreachable and
# break reproducible builds downstream. This is acknowledged and accepted as a
# short-term stopgap; a follow-up PR will land the no_std changes upstream on
# DataDog/libdatadog main and repoint this dependency to the upstream rev.
libdd-library-config = { git = "https://github.com/DataDog/libdatadog", rev = "7f3b16fe1b4bfc2a016ef869459e915ee02d6d6a", default-features = false }

[workspace.lints.clippy]
implicit_return = "deny"
needless_return = "allow"
doc_lazy_continuation = "deny"
iter_nth_zero = "deny"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"     # Optimize for size.
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
panic = "abort"     # Abort on panic
strip = true        # Automatically strip symbols from the binary.
