[workspace]
resolver = "2"
members = [
  "lib/inject-browser-sdk",
  "lib/inject-browser-sdk-ffi",
  "fuzz",
  "cmd/check_conf", "cmd/test_inject",
]

[workspace.package]
edition = "2021"
version = "1.2.1-dev"
rust-version = "1.91.0"

[workspace.dependencies]
# no_std library-config landed on DataDog/libdatadog main
# (7717de8e "feat(library-config)!: make libdd-library-config no_std
# compatible", PR #1770), so this pins upstream main instead of the former
# stopgap on a personal branch.
libdd-library-config = { git = "https://github.com/DataDog/libdatadog", rev = "278117feead185ad0f97863ee19af7e2b99ddfca", default-features = false }

[workspace.lints.clippy]
implicit_return = "deny"
needless_return = "allow"
doc_lazy_continuation = "deny"
iter_nth_zero = "deny"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"     # Optimize for size.
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
panic = "abort"     # Abort on panic
strip = true        # Automatically strip symbols from the binary.
