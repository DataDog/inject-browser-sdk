[package]
name = "inject-browser-sdk-fuzz"
edition.workspace = true
version.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The oracle of `oracle_differential`, shared with the corpus tests.
lol_html = "3.0.3"
encoding_rs = "0.8.44"
# The oracle of `tree_oracle`, see lib/inject-browser-sdk/tests/harness/tree.rs.
html5ever = "0.40.1"

[dependencies.inject-browser-sdk]
path = "../lib/inject-browser-sdk"

[dependencies.inject-browser-sdk-ffi]
path = "../lib/inject-browser-sdk-ffi"

[[bin]]
name = "fuzz-html-scanner"
path = "fuzz_targets/fuzz-html-scanner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunking_invariance"
path = "fuzz_targets/chunking_invariance.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oracle_differential"
path = "fuzz_targets/oracle_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_oracle"
path = "fuzz_targets/tree_oracle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "injector_c_api"
path = "fuzz_targets/injector_c_api.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scanner"
path = "fuzz_targets/scanner.rs"
test = false
doc = false
bench = false

[lints]
workspace = true
