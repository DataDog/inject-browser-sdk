[package]
name = "inject-browser-sdk"
description = "Injection library"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
std = ["serde/std", "serde_json/std"]
support_gov_domain = []

[dependencies]
# Vectorized byte search for the scans, which skip text a byte at a time otherwise.
memchr = { version = "2.7", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# The platform module reading the Datadog stable configuration files needs
# rustix and libdd-library-config; wasm32-unknown-unknown guests have no file
# system, so on that target the crate compiles to the pure injection core and
# hosts own stable configuration themselves.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
rustix = { version = "1.0", default-features = false, features = ["fs", "stdio"] }
libdd-library-config.workspace = true

# On Windows: libdd-library-config needs `std` because its StdConfigRead reader
# uses std::fs.
[target.'cfg(windows)'.dependencies]
libdd-library-config = { workspace = true, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
# The oracle of the corpus tests and fuzz targets, see tests/harness/oracle.rs. Dev-only: the
# library itself stays no_std.
lol_html = "3.0.3"
# What the oracle resolves `charset` labels with, independently of the injector's own table.
encoding_rs = "0.8.44"
pretty_assertions = { version = "1.4.0", features = ["unstable"] }
rand = "0.10.0"
serde = { version = "1.0", features = ["std"] }
serde_json = { version = "1.0", features = ["std"] }
