[package]
name = "inject-browser-sdk"
description = "Injection library"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
std = ["serde/std", "serde_json/std"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
rustix = { version = "1.0", default-features = false, features = ["fs", "stdio"] }
# Stopgap: pins `pawel/no-std-library-config` on DataDog/libdatadog which
# transitively pulls a personal `yaml_serde` fork (see Cargo.lock). A later PR
# will land the no_std changes upstream and repoint this dep.
libdd-library-config = { git = "https://github.com/DataDog/libdatadog", rev = "ef56bfed", default-features = false }

# On Windows: libdd-library-config needs `std` because its StdConfigRead reader
# uses std::fs. TODO: same personal-fork pin as above; repoint to upstream in a
# later PR.
[target.'cfg(windows)'.dependencies]
libdd-library-config = { git = "https://github.com/DataDog/libdatadog", rev = "ef56bfed", features = ["std"] }

[dev-dependencies]
pretty_assertions = { version = "1.4.0", features = ["unstable"] }
rand = "0.10.0"
serde = { version = "1.0", features = ["std"] }
serde_json = { version = "1.0", features = ["std"] }
