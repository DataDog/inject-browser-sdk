[package]
name = "inject-browser-sdk"
description = "Injection library"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
std = ["serde/std", "serde_json/std"]
support_gov_domain = []

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
rustix = { version = "1.0", default-features = false, features = ["fs", "stdio"] }
libdd-library-config.workspace = true

# On Windows: libdd-library-config needs `std` because its StdConfigRead reader
# uses std::fs. See the KNOWN RISK note in the root workspace Cargo.toml.
[target.'cfg(windows)'.dependencies]
libdd-library-config = { workspace = true, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = { version = "1.4.0", features = ["unstable"] }
rand = "0.10.0"
serde = { version = "1.0", features = ["std"] }
serde_json = { version = "1.0", features = ["std"] }
